<script>
function unlockAgeVerification() {
  localStorage.setItem('age_verified', 'true');
  const overlay = document.getElementById('age-verification-overlay');
  if (overlay) {
    overlay.style.display = 'none';
  }
  document.body.style.overflow = '';
}

function bypassAgeVerification() {
  unlockAgeVerification();
}

(function() {
  if (localStorage.getItem('age_verified') !== 'true') {
    const showOverlay = function() {
      const overlay = document.getElementById('age-verification-overlay');
      if (overlay) {
        overlay.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      }
    };
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', showOverlay);
    } else {
      showOverlay();
    }
  }
})();

// Optionnel : reçoit le résultat de la vérification dans la page qui a ouvert le popup
// (si tu as configuré une URL de redirection sur ce bouton, le visiteur y sera aussi renvoyé directement).
window.addEventListener('message', function(e) {
  if (e.data && e.data.source === 'amalgamG3-widget') {
    console.log('Résultat vérification amalgamG3 :', e.data.result, 'nom:', e.data.name, 'âge:', e.data.age);
    // e.data.result vaut 'verified', 'rejected' ou 'not_verified'
    // -> ajoute ici ta logique (débloquer le contenu, rediriger, etc.)
    if (e.data.result === 'verified') {
      unlockAgeVerification();
    }
  }
});
</script>
